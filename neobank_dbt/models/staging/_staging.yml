version: 2

models:
  - name: stg_customers
    description: One row per customer, cleaned from raw_data.customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['retail', 'premium', 'business']

  - name: stg_accounts
    description: One row per account
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_transactions
    description: One row per transaction, with a credit/debit direction
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit', 'debit']
